name: Compiler 1 le kernel NetHunter pour Huawei P10 (EMUI 9)

on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Build Kernel (AArch64)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: 🔄 Mettre à jour les sous-modules (KernelSU)
        run: git submodule update --init --recursive --force

      - name: 🔧 Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache build-essential \
            lzop \
            libncurses5-dev \
            libssl-dev \
            python3

      - name: 📦 Définir les variables d'environnement
        run: |
          echo "KERNEL_SOURCE=${{ github.workspace }}" >> $GITHUB_ENV
          echo "DEFCONFIG_NAME=Pangu_P10_defconfig" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV

      - name: ⚙️ Configurer ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ env.DEFCONFIG_NAME }}

      - name: ⬇️ Télécharger la toolchain (Android NDK)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip -q android-ndk-r23c-linux.zip
          echo "$HOME/toolchains/android-ndk-r23c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          aarch64-linux-android-gcc --version

      - name: 🛠️ Nettoyer et configurer
        working-directory: ${{ env.KERNEL_SOURCE }}
        run: |
          make mrproper
          make ${{ env.DEFCONFIG_NAME }}

      - name: 🚀 Compiler le kernel
        working-directory: ${{ env.KERNEL_SOURCE }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(nproc) ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} Image.gz-dtb

      - name: 📦 Préparer le fichier kernel.img
        run: |
          cp ${{ env.KERNEL_SOURCE }}/arch/arm64/boot/Image.gz-dtb ./kernel.img
          tar -czf kernel-nethunter-p10.tar.gz kernel.img

      - name: 📤 Uploader l'artefact (kernel.img)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nethunter-p10
          path: |
            kernel.img
            kernel-nethunter-p10.tar.gz
          retention-days: 7
