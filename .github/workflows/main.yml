name: Build Huawei-hi3660-KSU-Kernel-nethun
on:
  workflow_dispatch:
  schedule:
    # Run once at 12:00 on Saturday. See http://crontab.guru
    - cron: '00 12 * * 6'
  push:
    # Remplacez 'main' par la branche par défaut de votre repo si nécessaire
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Utiliser un runner GitHub-hosted
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y \
          binutils make python3 libssl-dev flex unzip ca-certificates \
          xz-utils cpio device-tree-compiler git git-lfs bc bison \
          build-essential ccache curl gcc-aarch64-linux-gnu g++-multilib
          # Assurer un lien python → python2 si nécessaire
          if [ ! -e /usr/bin/python ]; then
            sudo add-apt-repository universe
            sudo apt-get update
           sudo apt-get install -y python2
           sudo ln -s /usr/bin/python2 /usr/bin/python || true
          fi
          
          # Clone toolchains (fix --depth)
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9

      - name: GetTime
        id: get_time
        run: |
          echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build Kernel (P10)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          PATH: ${{ github.workspace }}/ToolChains/bin/:$PATH
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail
          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

          # Générer l'image de boot; ajuste --cmdline/--base/--ramdisk/--dtb si nécessaire
          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_P10_KSU-${TIME}.img

      - name: Upload P10-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_P10_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_P10_KSU-*.img"

      - name: Build Kernel (V9)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          PATH: ${{ github.workspace }}/ToolChains/bin/:$PATH
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu out Pangu_P10_KSU-*.img || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_V9_KSU-${TIME}.img

      - name: Upload V9-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_V9_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_V9_KSU-*.img"
