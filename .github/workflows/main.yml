name: Build Huawei-hi3660-KSU-Kernel (with AnyKernel3)

on:
  workflow_dispatch:        # يسمح بالتشغيل اليدوي
  schedule:
    - cron: '00 12 * * 6'   # كل سبت الساعة 12 ظهراً
  push:
    branches:
      - HEAD
  pull_request:
    branches:
      - HEAD

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 100

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt install -y binutils make python2 libssl-dev flex unzip libssl-dev \
            ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs bc \
            bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev adb fastboot
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9

      - name: Clean previous builds
        run: |
          make distclean || true
          rm -rf out
          rm -rf KernelSU
          rm -rf drivers/kernelsu
          find . -name "*.o" -delete 2>/dev/null || true
          find . -name "*.cmd" -delete 2>/dev/null || true
          find . -name "*.tmp" -delete 2>/dev/null || true

      - name: Get build timestamp
        id: get_time
        run: echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      # ==================== بناء P10 ====================
      - name: Build P10 Kernel
        run: |
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Package P10 kernel with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel-p10
          # نسخ Image.gz (مخرج البناء)
          cp out/arch/arm64/boot/Image.gz anykernel-p10/ || { echo "Image.gz not found!"; exit 1; }
          # نسخ ملفات dtb إذا كانت موجودة
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb anykernel-p10/ 2>/dev/null || echo "No dtb files found"
          fi
          # إنشاء نسختين (enforcing / permissive) بتعديل anykernel.sh
          for mode in enforcing permissive; do
            cp -r anykernel-p10 anykernel-p10-$mode
            if [ "$mode" = "enforcing" ]; then
              sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user"|' anykernel-p10-$mode/anykernel.sh
            else
              sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user"|' anykernel-p10-$mode/anykernel.sh
            fi
            cd anykernel-p10-$mode
            zip -r9 ../../Pangu_P10_KSU-${mode}-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md
            cd ../..
          done
          rm -rf anykernel-p10*

      # ==================== بناء V9 ====================
      - name: Build V9 Kernel
        run: |
          rm -rf out KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          # تعطيل CONFIG_DTC (إذا لزم الأمر)
          (cd out && ../scripts/config --file .config --disable CONFIG_DTC)
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Package V9 kernel with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel-v9
          cp out/arch/arm64/boot/Image.gz anykernel-v9/ || { echo "Image.gz not found!"; exit 1; }
          # تعديل مسار dtb حسب جهاز V9 (غالباً نفس المسار)
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb anykernel-v9/ 2>/dev/null || echo "No dtb files found"
          fi
          for mode in enforcing permissive; do
            cp -r anykernel-v9 anykernel-v9-$mode
            if [ "$mode" = "enforcing" ]; then
              sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user"|' anykernel-v9-$mode/anykernel.sh
            else
              sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user"|' anykernel-v9-$mode/anykernel.sh
            fi
            cd anykernel-v9-$mode
            zip -r9 ../../Pangu_V9_KSU-${mode}-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md
            cd ../..
          done
          rm -rf anykernel-v9*

      # ==================== رفع الملفات الناتجة ====================
      - name: Upload P10 kernels
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_P10_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: |
            Pangu_P10_KSU-enforcing-*.zip
            Pangu_P10_KSU-permissive-*.zip

      - name: Upload V9 kernels
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_V9_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: |
            Pangu_V9_KSU-enforcing-*.zip
            Pangu_V9_KSU-permissive-*.zip

      # خطوة تشخيصية (اختيارية) لعرض محتويات out/boot
      - name: List boot files (debug)
        if: always()
        run: |
          echo "=== P10 build output ==="
          ls -la out/arch/arm64/boot/ || true
          echo "=== DTB files ==="
          find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null || echo "No dtb found"
