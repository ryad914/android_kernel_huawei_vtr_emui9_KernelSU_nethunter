name: Build Huawei-hi3660-KSU-Kernel
on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 6'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Runner info
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a || true
          cat /etc/os-release || true
          echo "PATH preview:"
          echo "$PATH" | tr ':' '\n' | sed -n '1,20p'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies (including dtc/flex/bison)
        run: |
          set -euo pipefail

          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          # Use apt on ubuntu runners
          if command -v apt-get >/dev/null 2>&1; then
            echo "Using apt-get"
            $SUDO apt-get update -y
            $SUDO apt-get install -y --no-install-recommends software-properties-common ca-certificates

            # Ensure universe for python2 if needed
            $SUDO add-apt-repository -y universe || true
            $SUDO apt-get update -y

            # Install required packages and explicit dtc/flex/bison
            $SUDO apt-get install -y --no-install-recommends \
              binutils make python3 libssl-dev flex bison unzip ca-certificates \
              xz-utils cpio device-tree-compiler libfdt-dev git git-lfs bc bison \
              build-essential ccache curl gcc-aarch64-linux-gnu

            # Try to install python2 if scripts expect it; ignore if unavailable
            $SUDO apt-get install -y --no-install-recommends python2 || true

            # create python symlink only with sudo if necessary
            if command -v python2 >/dev/null 2>&1 && [ ! -e /usr/bin/python ]; then
              $SUDO ln -sf "$(command -v python2)" /usr/bin/python || true
            fi
          else
            echo "Non-apt environment: aborting (workflow expects ubuntu-hosted runners)."
            exit 1
          fi

          # Clone toolchains shallow
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9

          # Add ToolChains/bin to PATH for subsequent steps in a safe way
          echo "PATH=$(pwd)/ToolChains/bin:$PATH" >> $GITHUB_ENV

      - name: GetTime
        id: get_time
        run: |
          echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build Kernel (P10)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          # Ensure python link (use sudo where required)
          if command -v sudo >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/python2 /usr/bin/python || true
          else
            ln -sf /usr/bin/python2 /usr/bin/python || true
          fi

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu || true

          # Use system dtc to avoid building conflicting shipped dtc
          export SYSTEM_DTC="$(command -v dtc || true)"
          if [ -z "$SYSTEM_DTC" ]; then
            echo "WARNING: dtc not found in PATH; kernel build may build scripts/dtc from source"
          else
            echo "Using system dtc at $SYSTEM_DTC"
          fi

          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          # Pass DTC=$(which dtc) to force using the system dtc binary
          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig DTC="$(command -v dtc || true)"
          make $KERNEL_CMDLINE -j$(nproc --all) DTC="$(command -v dtc || true)"

          # Generate boot image; adjust options if needed
          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_P10_KSU-${TIME}.img

      - name: Upload P10-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_P10_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_P10_KSU-*.img"

      - name: Build Kernel (V9)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu out Pangu_P10_KSU-*.img || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_KSU_defconfig DTC="$(command -v dtc || true)"
          make $KERNEL_CMDLINE -j$(nproc --all) DTC="$(command -v dtc || true)"

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_V9_KSU-${TIME}.img

      - name: Upload V9-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_V9_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_V9_KSU-*.img"
