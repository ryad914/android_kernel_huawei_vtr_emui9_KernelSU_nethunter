name: Compiler 1 le kernel NetHunter pour Huawei P10 (EMUI 9)

on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Build Kernel (AArch64)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Ajouter KernelSU manuellement
        run: |
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu
          echo "Contenu de drivers/kernelsu :"
          ls -la drivers/kernelsu/
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "ERREUR: drivers/kernelsu/Kconfig manquant !"
            exit 1
          fi

      - name: 🔧 Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache build-essential \
            lzop \
            libncurses5-dev \
            libssl-dev \
            python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: 📦 Définir les variables d'environnement
        run: |
          echo "KERNEL_SOURCE=${{ github.workspace }}" >> $GITHUB_ENV
          echo "DEFCONFIG_NAME=Pangu_KSU_defconfig" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: ⚙️ Configurer ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ env.DEFCONFIG_NAME }}

      - name: 🛠️ Nettoyer et configurer
        working-directory: ${{ env.KERNEL_SOURCE }}
        run: |
          make mrproper
          make ${{ env.DEFCONFIG_NAME }}

      - name: 🚀 Compiler le kernel
        working-directory: ${{ env.KERNEL_SOURCE }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(nproc) ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} Image.gz-dtb

      - name: 📦 Préparer le fichier kernel.img
        run: |
          cp ${{ env.KERNEL_SOURCE }}/arch/arm64/boot/Image.gz-dtb ./kernel.img
          tar -czf kernel-nethunter-p10.tar.gz kernel.img

      - name: 📤 Uploader l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nethunter-p10
          path: |
            kernel.img
            kernel-nethunter-p10.tar.gz
          retention-days: 7
