name: Build Huawei-hi3660-NetHunter-KSU-Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 6'
  push:
    branches:
      - Github_Action_Mode
  pull_request:
    branches:
      - Github_Action_Mode

jobs:
  build:
    runs-on: ubuntu-20.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 100

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            binutils \
            ca-certificates \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            g++ \
            gcc \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            make \
            pngcrush \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev
          
          # Create Python2 symlink for compatibility
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          
          # Clone toolchain
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9 || true

      - name: Clean previous builds
        run: |
          make distclean 2>/dev/null || true
          rm -rf out
          find . -name "*.o" -delete 2>/dev/null || true
          find . -name "*.cmd" -delete 2>/dev/null || true
          find . -name "*.tmp" -delete 2>/dev/null || true

      - name: Get build timestamp
        id: get_time
        run: echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      # ==================== Build P10 Enforcing ====================
      - name: Build P10 Enforcing
        run: |
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all) 2>&1 | tail -50 || true

      - name: Package P10 Enforcing
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Warning: Image.gz not found, trying Image"
            ls -la out/arch/arm64/boot/ || true
            exit 0
          fi
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak-p10-enf
          cp out/arch/arm64/boot/Image.gz ak-p10-enf/
          
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb ak-p10-enf/ 2>/dev/null || true
          fi
          
          # Update cmdline
          if grep -q "^cmdline=" ak-p10-enf/anykernel.sh; then
            sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user"|' ak-p10-enf/anykernel.sh
          fi
          
          cd ak-p10-enf
          zip -r9 ../Pangu_P10_NetHunter_KSU-enforcing-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md 2>/dev/null || true
          cd ..

      # ==================== Build P10 Permissive ====================
      - name: Build P10 Permissive
        run: |
          rm -rf out
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all) 2>&1 | tail -50 || true

      - name: Package P10 Permissive
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Warning: Image.gz not found"
            exit 0
          fi
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak-p10-perm
          cp out/arch/arm64/boot/Image.gz ak-p10-perm/
          
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb ak-p10-perm/ 2>/dev/null || true
          fi
          
          if grep -q "^cmdline=" ak-p10-perm/anykernel.sh; then
            sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user"|' ak-p10-perm/anykernel.sh
          fi
          
          cd ak-p10-perm
          zip -r9 ../Pangu_P10_NetHunter_KSU-permissive-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md 2>/dev/null || true
          cd ..

      # ==================== Build V9 Enforcing ====================
      - name: Build V9 Enforcing
        run: |
          rm -rf out
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all) 2>&1 | tail -50 || true

      - name: Package V9 Enforcing
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Warning: Image.gz not found"
            exit 0
          fi
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak-v9-enf
          cp out/arch/arm64/boot/Image.gz ak-v9-enf/
          
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb ak-v9-enf/ 2>/dev/null || true
          fi
          
          if grep -q "^cmdline=" ak-v9-enf/anykernel.sh; then
            sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user"|' ak-v9-enf/anykernel.sh
          fi
          
          cd ak-v9-enf
          zip -r9 ../Pangu_V9_NetHunter_KSU-enforcing-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md 2>/dev/null || true
          cd ..

      # ==================== Build V9 Permissive ====================
      - name: Build V9 Permissive
        run: |
          rm -rf out
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all) 2>&1 | tail -50 || true

      - name: Package V9 Permissive
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Warning: Image.gz not found"
            exit 0
          fi
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak-v9-perm
          cp out/arch/arm64/boot/Image.gz ak-v9-perm/
          
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb ak-v9-perm/ 2>/dev/null || true
          fi
          
          if grep -q "^cmdline=" ak-v9-perm/anykernel.sh; then
            sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user"|' ak-v9-perm/anykernel.sh
          fi
          
          cd ak-v9-perm
          zip -r9 ../Pangu_V9_NetHunter_KSU-permissive-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md 2>/dev/null || true
          cd ..

      # ==================== Upload Artifacts ====================
      - name: Upload P10 Kernels
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pangu_P10_NetHunter_KSU-${{ steps.get_time.outputs.TIME }}
          path: Pangu_P10_NetHunter_KSU-*.zip
          retention-days: 30

      - name: Upload V9 Kernels
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pangu_V9_NetHunter_KSU-${{ steps.get_time.outputs](#)

