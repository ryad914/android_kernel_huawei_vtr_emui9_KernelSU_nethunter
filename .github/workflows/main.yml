name: Build Huawei-hi3660-NetHunter-KSU-Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 6'
  push:
    branches:
      - Github_Action_Mode
  pull_request:
    branches:
      - Github_Action_Mode

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 100

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt install -y binutils make python2 libssl-dev flex unzip \
            ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs bc \
            bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev adb fastboot
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9

      - name: Clean previous builds
        run: |
          make distclean || true
          rm -rf out
          find . -name "*.o" -delete 2>/dev/null || true
          find . -name "*.cmd" -delete 2>/dev/null || true
          find . -name "*.tmp" -delete 2>/dev/null || true

      - name: Get build timestamp
        id: get_time
        run: echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      # ==================== Build P10 NetHunter + KSU ====================
      - name: Build P10 NetHunter with KSU
        run: |
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Package P10 NetHunter - Enforcing
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel-p10-enf
          cp out/arch/arm64/boot/Image.gz anykernel-p10-enf/ || exit 1
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb anykernel-p10-enf/ 2>/dev/null || true
          fi
          sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user"|' anykernel-p10-enf/anykernel.sh
          cd anykernel-p10-enf
          zip -r9 ../Pangu_P10_NetHunter_KSU-enforcing-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md
          cd ..
          rm -rf anykernel-p10-enf

      - name: Build P10 NetHunter - Permissive
        run: |
          rm -rf out
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Package P10 NetHunter - Permissive
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel-p10-perm
          cp out/arch/arm64/boot/Image.gz anykernel-p10-perm/ || exit 1
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb anykernel-p10-perm/ 2>/dev/null || true
          fi
          sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user"|' anykernel-p10-perm/anykernel.sh
          cd anykernel-p10-perm
          zip -r9 ../Pangu_P10_NetHunter_KSU-permissive-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md
          cd ..
          rm -rf anykernel-p10-perm

      # ==================== Build V9 NetHunter + KSU ====================
      - name: Build V9 NetHunter with KSU
        run: |
          rm -rf out
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Package V9 NetHunter - Enforcing
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel-v9-enf
          cp out/arch/arm64/boot/Image.gz anykernel-v9-enf/ || exit 1
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb anykernel-v9-enf/ 2>/dev/null || true
          fi
          sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user"|' anykernel-v9-enf/anykernel.sh
          cd anykernel-v9-enf
          zip -r9 ../Pangu_V9_NetHunter_KSU-enforcing-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md
          cd ..
          rm -rf anykernel-v9-enf

      - name: Build V9 NetHunter - Permissive
        run: |
          rm -rf out
          export PATH=$(pwd)/ToolChains/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE olddefconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

      - name: Package V9 NetHunter - Permissive
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel-v9-perm
          cp out/arch/arm64/boot/Image.gz anykernel-v9-perm/ || exit 1
          if [ -d out/arch/arm64/boot/dts/hisilicon ]; then
            cp out/arch/arm64/boot/dts/hisilicon/*.dtb anykernel-v9-perm/ 2>/dev/null || true
          fi
          sed -i 's|^cmdline=.*|cmdline="loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user"|' anykernel-v9-perm/anykernel.sh
          cd anykernel-v9-perm
          zip -r9 ../Pangu_V9_NetHunter_KSU-permissive-${{ steps.get_time.outputs.TIME }}.zip * -x .git README.md
          cd ..
          rm -rf anykernel-v9-perm

      # ==================== Upload Artifacts ====================
      - name: Upload P10 Kernels
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_P10_NetHunter_KSU-${{ steps.get_time.outputs.TIME }}
          path: |
            Pangu_P10_NetHunter_KSU-enforcing-*.zip
            Pangu_P10_NetHunter_KSU-permissive-*.zip
          retention-days: 30

      - name: Upload V9 Kernels
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_V9_NetHunter_KSU-${{ steps.get_time.outputs.TIME }}
          path: |
            Pangu_V9_NetHunter_KSU-enforcing-*.zip
            Pangu_V9_NetHunter_KSU-permissive-*.zip
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Built kernels:"
          ls -lh Pangu_*.zip 2>/dev/null || echo "No kernels found"
          echo ""
          echo "Boot files:"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "Build incomplete"
