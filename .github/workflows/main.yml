name: Build Huawei-hi3660-KSU-Kernel
on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 6'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Définit bash comme shell par défaut pour toutes les étapes 'run'
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Runner & environment diagnostic
        run: |
          echo "=== Runner information ==="
          # Affiche l'image / labels du runner (utile pour debug)
          echo "GITHUB_RUNNER_LABELS=$RUNNER_LABELS"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "--------------------------------"
          uname -a || true
          cat /etc/os-release || true
          echo "PATH=$PATH"
          echo "Which core utils:"
          which sudo || true
          which rm || true
          which bash || true
          which curl || true
          echo "Listing /bin and /usr/bin (head)"
          ls -la /bin | head -30 || true
          ls -la /usr/bin | head -30 || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies (robuste)
        run: |
          set -euo pipefail

          # Detecte si sudo existe ; si non, exécuter sans sudo (par ex. si root dans un container)
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          # Détecte le gestionnaire de paquets (apt pour Ubuntu/Debian, apk pour Alpine)
          if command -v apt-get >/dev/null 2>&1; then
            echo "Using apt-get"
            $SUDO apt-get update -y
            $SUDO apt-get install -y --no-install-recommends software-properties-common ca-certificates

            # On active universe (pour python2 si nécessaire)
            $SUDO add-apt-repository -y universe || true
            $SUDO apt-get update -y

            # Installer paquets pour cross-compile aarch64 ; on retire g++-multilib
            $SUDO apt-get install -y --no-install-recommends \
              binutils make python3 libssl-dev flex unzip \
              xz-utils cpio device-tree-compiler git git-lfs bc bison \
              build-essential ccache curl gcc-aarch64-linux-gnu

            # python2 (optionnel) ; ignore l'erreur si indisponible
            $SUDO apt-get install -y --no-install-recommends python2 || true

            # Assure un lien python -> python2 si python2 existe et si lien absent
            if command -v python2 >/dev/null 2>&1 && [ ! -e /usr/bin/python ]; then
              $SUDO ln -s "$(command -v python2)" /usr/bin/python || true
            fi

          elif command -v apk >/dev/null 2>&1; then
            # Cas d'image Alpine minimal (container)
            echo "Using apk (Alpine)"
            if [ -n "$SUDO" ]; then
              $SUDO apk update
              $SUDO apk add --no-cache bash coreutils curl build-base git git-lfs zlib-dev linux-headers cpio xz
            else
              apk update
              apk add --no-cache bash coreutils curl build-base git git-lfs zlib-dev linux-headers cpio xz
            fi

            # Note: package names et toolchain diffèrent sur Alpine; si possible utilise ubuntu-latest runner
          else
            echo "Unsupported environment: no apt-get or apk found. Print PATH and exit."
            echo "PATH=$PATH"
            exit 1
          fi

          # Clone toolchains (shallow)
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9

      - name: GetTime
        id: get_time
        run: |
          echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build Kernel (P10)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          PATH: ${{ github.workspace }}/ToolChains/bin/:$PATH
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          # Si sudo est présent, on l'utilise pour créer le lien; sinon on suppose qu'on est root
          if command -v sudo >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/python2 /usr/bin/python || true
          else
            ln -sf /usr/bin/python2 /usr/bin/python || true
          fi

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_P10_KSU-${TIME}.img

      - name: Upload P10-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_P10_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_P10_KSU-*.img"

      - name: Build Kernel (V9)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          PATH: ${{ github.workspace }}/ToolChains/bin/:$PATH
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu out Pangu_P10_KSU-*.img || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_V9_KSU-${TIME}.img

      - name: Upload V9-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_V9_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_V9_KSU-*.img"
