name: Build Huawei-hi3660-KSU-Kernel
on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 6'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Runner & environment diagnostic
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          uname -a || true
          cat /etc/os-release || true
          echo "Which: sudo=$(command -v sudo || echo none) rm=$(command -v rm || echo none) curl=$(command -v curl || echo none) bash=$(command -v bash || echo none)"
          echo "PATH head:"
          echo "$PATH" | tr ':' '\n' | sed -n '1,10p'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies
        run: |
          set -euo pipefail

          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          if command -v apt-get >/dev/null 2>&1; then
            echo "Using apt-get"
            $SUDO apt-get update -y
            $SUDO apt-get install -y --no-install-recommends software-properties-common ca-certificates

            # Enable universe for python2 (if needed)
            $SUDO add-apt-repository -y universe || true
            $SUDO apt-get update -y

            # Install packages needed for cross-compiling to aarch64 (removed g++-multilib)
            $SUDO apt-get install -y --no-install-recommends \
              binutils make python3 libssl-dev flex unzip \
              xz-utils cpio device-tree-compiler git git-lfs bc bison \
              build-essential ccache curl gcc-aarch64-linux-gnu

            # Try installing python2 if needed (ignore failure)
            $SUDO apt-get install -y --no-install-recommends python2 || true

            if command -v python2 >/dev/null 2>&1 && [ ! -e /usr/bin/python ]; then
              $SUDO ln -s "$(command -v python2)" /usr/bin/python || true
            fi
          elif command -v apk >/dev/null 2>&1; then
            echo "Using apk (Alpine) - installing available packages"
            if [ -n "$SUDO" ]; then
              $SUDO apk update
              $SUDO apk add --no-cache bash coreutils curl build-base git git-lfs cpio xz
            else
              apk update
              apk add --no-cache bash coreutils curl build-base git git-lfs cpio xz
            fi
          else
            echo "No supported package manager found (apt-get or apk)."
            exit 1
          fi

          # Clone toolchains (shallow)
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9

          # Add ToolChains/bin to PATH for subsequent steps without overwriting system PATH
          echo "PATH=$(pwd)/ToolChains/bin:$PATH" >> $GITHUB_ENV

      - name: GetTime
        id: get_time
        run: |
          echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build Kernel (P10)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          # Now ln/rm/curl should be available because PATH was preserved and augmented
          ln -sf /usr/bin/python2 /usr/bin/python || true

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_P10_KSU-${TIME}.img

      - name: Upload P10-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_P10_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_P10_KSU-*.img"

      - name: Build Kernel (V9)
        env:
          TIME: ${{ steps.get_time.outputs.TIME }}
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail

          if [ -d include/config ]; then
            echo "Found include/config, removing it"
            rm -rf include/config
          fi

          rm -rf KernelSU drivers/kernelsu out Pangu_P10_KSU-*.img || true
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2

          make $KERNEL_CMDLINE Pangu_KSU_defconfig
          make $KERNEL_CMDLINE -j$(nproc --all)

          tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0" \
            -o Pangu_V9_KSU-${TIME}.img

      - name: Upload V9-KSU-Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pangu_V9_KSU-kernel-${{ steps.get_time.outputs.TIME }}
          path: "Pangu_V9_KSU-*.img"
